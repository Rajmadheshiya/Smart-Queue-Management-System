<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Check Queue Status</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #eef5f9;
    text-align: center;
    padding-top: 60px;
}

.card {
    width: 450px;
    margin: auto;
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

h1 {
    color: #203a43;
}

input {
    width: 90%;
    padding: 12px;
    margin: 15px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 95%;
    padding: 13px;
    background: #0d6efd;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #084298;
}

.error {
    color: red;
    font-weight: bold;
    margin-top: 15px;
}

.home-btn {
    display: block;
    text-decoration: none;
    background: #198754;
    color: white;
    padding: 12px;
    border-radius: 8px;
    margin-top: 20px;
}

</style>

</head>

<body>

<div class="card">

    <h1>🔎 Check Queue Status</h1>

    <p>Enter your token number to check your queue status.</p>

    <form th:action="@{/patient/status}" method="post">

        <input
            type="number"
            name="tokenNumber"
            placeholder="Enter Token Number"
            required>

        <button type="submit">
            🔍 Check Status
        </button>

    </form>

    <p class="error"
       th:if="${error}"
       th:text="${error}">
    </p>

    <a th:href="@{/}" class="home-btn">
        🏠 Home
    </a>

</div>

</body>

</html>
