<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Patient Registration</title>

<link rel="stylesheet" th:href="@{/css/style.css}">

<style>

.form-group{
    text-align:left;
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
    color:#203a43;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    margin-top:15px;
    transition:.3s;
}

button:hover{
    background:#084298;
}

.top-btn{
    display:block;
    text-decoration:none;
    background:#198754;
    color:white;
    padding:12px;
    border-radius:8px;
    margin-bottom:20px;
    text-align:center;
    font-weight:bold;
}

.top-btn:hover{
    background:#146c43;
}

</style>

</head>

<body>

<div class="container">

<h1>Patient Registration</h1>

<div th:if="${error}" class="error-message">
    <span th:text="${error}"></span>
</div>

<a th:href="@{/}" class="top-btn">
🏠 Home
</a>

<form th:action="@{/patient/save}" th:object="${patient}" method="post">
	
	<input type="hidden" th:field="*{id}">
	<input type="hidden" th:field="*{tokenNumber}">
	<input type="hidden" th:field="*{status}">


    <div class="form-group">
        <label>Name</label>
        <input type="text" th:field="*{name}" required>
    </div>

    <div class="form-group">
        <label>Age</label>
        <input type="number" th:field="*{age}" required>
    </div>

    <div class="form-group">
        <label>Gender</label>
        <input type="text" th:field="*{gender}" required>
    </div>

    <div class="form-group">
        <label>Phone</label>
        <input type="text" th:field="*{phone}" required>
    </div>

    <button type="submit">
        💾 Save Patient
    </button>

</form>

</div>

</body>

</html>
